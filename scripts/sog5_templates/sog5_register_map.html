<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOG5 Kılavuz Register Listesi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .page-wrap { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .toolbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .toolbar .left, .toolbar .right { display: flex; gap: 10px; align-items: center; }
        .btn { background: #1e90ff; color: #fff; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background: #34495e; }
        .meta { color: #b7c0ff; font-size: 14px; }
        .status-ok { color: #3ef58f; font-weight: 600; }
        .status-err { color: #ff7f7f; font-weight: 600; }
        .table-wrap { overflow: auto; border-radius: 12px; border: 1px solid #2a3c70; }
        table { width: 100%; border-collapse: collapse; min-width: 980px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #22315e; text-align: left; font-size: 14px; }
        th { background: #152447; color: #d7e3ff; position: sticky; top: 0; z-index: 1; }
        tr:nth-child(even) td { background: rgba(25, 38, 74, 0.35); }
        .mono { font-family: Consolas, Menlo, monospace; }
        .note { color: #8ea2d6; }
    </style>
</head>
<body>
<div class="page-wrap">
    <div class="toolbar">
        <div class="left">
            <h1>SOG5 Kılavuz Registerları</h1>
            <span class="meta" id="metaInfo">Yükleniyor...</span>
        </div>
        <div class="right">
            <button class="btn" id="refreshBtn">Canlı Oku</button>
            <label class="meta"><input type="checkbox" id="autoChk"> Otomatik (20 sn)</label>
            <a class="btn btn-secondary" href="/">Dashboard</a>
        </div>
    </div>

    <div class="meta" id="lastRead">Son okuma: -</div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Adres</th>
                    <th>Etiket</th>
                    <th>Anahtar</th>
                    <th>Veri Tipi</th>
                    <th>Scale</th>
                    <th>Birim</th>
                    <th>Erisim</th>
                    <th>Ham Register</th>
                    <th>Decode Değer</th>
                    <th>Durum</th>
                    <th>Not</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>

<script>
const tbody = document.getElementById('tbody');
const metaInfo = document.getElementById('metaInfo');
const lastRead = document.getElementById('lastRead');
const autoChk = document.getElementById('autoChk');
const refreshBtn = document.getElementById('refreshBtn');
let timer = null;

function fmtRaw(raw) {
    if (!raw || !Array.isArray(raw)) return '-';
    return raw.join(', ');
}

function renderRows(rows) {
    tbody.innerHTML = '';
    rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="mono">${r.addr}</td>
            <td>${r.label || '-'}</td>
            <td class="mono">${r.key}</td>
            <td class="mono">${r.dtype}</td>
            <td class="mono">${r.scale}</td>
            <td>${r.unit || '-'}</td>
            <td class="mono">${r.access || '-'}</td>
            <td class="mono">${fmtRaw(r.raw)}</td>
            <td class="mono">${r.value === null || r.value === undefined ? '-' : r.value}</td>
            <td class="${r.ok ? 'status-ok' : 'status-err'}">${r.ok ? 'OK' : 'HATA'}</td>
            <td class="note">${r.error ? r.error : (r.note || '')}</td>
        `;
        tbody.appendChild(tr);
    });
}

async function loadMeta() {
    const res = await fetch('/api/register-map');
    const json = await res.json();
    metaInfo.textContent = `IP ${json.ip}:${json.port} | Unit ID ${json.unit_id} | Toplam ${json.count} adres`;
}

async function loadLive() {
    refreshBtn.disabled = true;
    try {
        const res = await fetch('/api/register-map/live');
        const json = await res.json();
        if (!json.success) {
            lastRead.textContent = 'Hata: ' + (json.error || 'Bilinmeyen hata');
            return;
        }
        renderRows(json.rows || []);
        lastRead.textContent = 'Son okuma: ' + (json.timestamp || '-');
    } catch (e) {
        lastRead.textContent = 'Hata: ' + e.message;
    } finally {
        refreshBtn.disabled = false;
    }
}

function scheduleAuto() {
    if (timer) clearInterval(timer);
    if (autoChk.checked) {
        timer = setInterval(loadLive, 20000);
    }
}

refreshBtn.addEventListener('click', loadLive);
autoChk.addEventListener('change', scheduleAuto);

loadMeta().then(loadLive);
</script>
</body>
</html>
